<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8" />
    <title>Message Header Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <header id="SectionHeader">
        <div id="floater"></div>
        <h1 id="title">Message Header Analyzer</h1>
    </header>
    <main id="SectionContent">
        <section role="region" aria-label="Input Headers">
            <h2 id="inputSection" class="sr-only">Input Headers</h2>
            <textarea id="inputHeaders" autofocus="autofocus" placeholder="Paste headers here." required="required"
                rows="15"></textarea>
            <fluent-button appearance="primary" id="analyzeButton" aria-describedby="analyzeButtonDesc">
                <span>Analyze headers</span>
                <div class="status-overlay status-overlay-inline" id="analyzeStatusMessage" role="status" aria-live="polite">
                </div>
                <div class="status-overlay status-overlay-inline" id="clearStatusMessage" role="status" aria-live="polite">
                </div>
            </fluent-button>
            <span id="analyzeButtonDesc" class="sr-only">Analyze message headers</span>
            <fluent-button class="hiddenElement" id="clearButton" aria-label="Clear input and results">
                <span>Clear</span>
            </fluent-button>
            <fluent-button class="hiddenElement" id="copyButton" aria-describedby="copyButtonDesc">
                <span class="fluent-icon fluent-icon--copy"></span>
                <span>Copy</span>
                <span id="copyButtonDesc" class="sr-only">Copy analysis results to clipboard</span>
                <div class="status-overlay status-overlay-inline" id="copyStatusMessage" role="status" aria-live="polite">
                </div>
            </fluent-button>
            <div id="aboutLink">
                <button type="button" id="aboutButton">About</button>
            </div>
        </section>

        <hr id="lineBreak" />

        <section id="response" class="hiddenElement" role="region" aria-label="Analysis Results">
            <h2 id="resultsSection" class="sr-only">Analysis Results</h2>
            <div class="responsePane">
                <div id="status"></div>
                <table id="summary"></table>
                <div id="diagnosticsContent" class="hiddenElement"></div>
                <table id="receivedHeaders"></table>
                <table id="forefrontAntiSpamReport"></table>
                <table id="antiSpamReport"></table>
                <table id="otherHeaders"></table>
            </div>
        </section>
    </main>

    <fluent-dialog id="aboutDialog" aria-label="About Message Header Analyzer" hidden>
        <header class="dialog-header">
            <h2>About</h2>
        </header>
        <section class="dialog-content">
            <dl>
                <dt>Build</dt>
                <dd id="aboutBuild"></dd>
                <dt id="aboutCommitLabel">Commit</dt>
                <dd><a id="aboutCommit" target="_blank" rel="noopener noreferrer"></a></dd>
                <dt>Built</dt>
                <dd><time id="aboutBuiltAt"></time></dd>
            </dl>
            <p><a href="https://github.com/microsoft/MHA" target="_blank" rel="noopener noreferrer">Project on GitHub</a></p>
            <p><a href="https://github.com/microsoft/MHA/issues" target="_blank" rel="noopener noreferrer">Submit feedback on GitHub</a></p>
        </section>
        <footer class="dialog-actions">
            <fluent-button appearance="primary" id="aboutCloseButton">Close</fluent-button>
        </footer>
    </fluent-dialog>

    <template id="violation-inline-template">
        <span class="violation-inline">
            <span class="severity-badge"></span>
            <span class="violation-message"></span>
        </span>
    </template>

    <template id="violation-card-template">
        <div class="violation-card">
            <div class="violation-card-header">
                <span class="severity-badge"></span>
                <span class="violation-message"></span>
            </div>
            <div class="violation-details">
                <div class="violation-rule"></div>
                <div class="violation-parent-message"></div>
            </div>
        </div>
    </template>

    <template id="diagnostic-accordion-item-template">
        <div class="diagnostic-group">
            <div class="violation-card-header">
                <span class="severity-badge"></span>
                <span class="violation-message"></span>
            </div>
            <div class="diagnostic-content diagnostic-violations"></div>
        </div>
    </template>
</body>

</html>
